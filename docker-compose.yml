version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-wagering_db}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:latest
    container_name: wagering-ministack
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SQS_PORT:-4566}:4566"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      STATE_DIR: /data/ministack-state
    volumes:
      - ministack-data:/data
      - ./docker/ministack/init/ready.d:/docker-entrypoint-initaws.d/ready.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "aws --endpoint-url=http://localhost:4566 sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1 && aws --endpoint-url=http://localhost:4566 sqs get-queue-url --queue-name wager-transactions-dlq.fifo >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-wagering_db}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      SQS_ENDPOINT: http://ministack:4566
      SQS_WAGER_TRANSACTIONS_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_TRANSACTIONS_DLQ_NAME: wager-transactions-dlq.fifo
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

volumes:
  pgdata:
  ministack-data:
