services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-wagering_db}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://ministack:4566
      SQS_WAGER_TRANSACTIONS_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_TRANSACTIONS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_WAGER_EVENTS_QUEUE_NAME: wager-events.fifo

    ports:
      - "3000:3000"

    volumes:
      - .:/usr/src/app
      - dev_node_modules:/usr/src/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy

volumes:
  dev_node_modules: